<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBarber | Giriş Yap</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex items-center justify-center min-h-screen px-4">

    <div class="bg-white p-8 rounded-xl shadow-md border border-slate-200 w-full max-w-md">
        <div class="text-center mb-6">
            <a href="index.html" class="text-2xl font-bold text-indigo-600 tracking-wide">SkyBarber</a>
            <p class="text-sm text-slate-500 mt-2" id="auth-subtitle">Hesabınıza giriş yapın</p>
        </div>

        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">E-posta Adresi</label>
                <input type="email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Şifre</label>
                <input type="password" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition">Giriş Yap</button>
        </form>

        <div class="text-center mt-6 text-sm">
            <button id="toggle-auth" class="text-indigo-600 hover:underline font-medium">Yeni hesap oluştur</button>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
