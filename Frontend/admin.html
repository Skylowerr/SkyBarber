<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBarber | Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <nav class="bg-slate-900 text-white py-4 px-6 flex justify-between items-center">
        <a href="index.html" class="text-xl font-bold tracking-wide text-indigo-400">SkyBarber Yönetim</a>
        <a href="index.html" class="text-sm text-slate-300 hover:text-white transition">Müşteri Sayfası →</a>
    </nav>

    <main class="max-w-6xl mx-auto mt-8 px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
            <h2 class="text-lg font-bold text-slate-900 mb-4" id="form-title">Yeni Hizmet Ekle</h2>
            <form id="service-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Hizmet Adı</label>
                    <input type="text" id="service-name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Fiyat (TL)</label>
                    <input type="number" id="service-price" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition">Kaydet</button>
            </form>
        </div>

        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-900 mb-4">Mevcut Hizmetler</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-sm font-medium text-slate-500">
                            <th class="pb-3">Hizmet</th>
                            <th class="pb-3">Fiyat</th>
                            <th class="pb-3 text-right">İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="admin-services-list" class="divide-y divide-slate-100 text-sm">
                        <tr>
                            <td class="py-3 font-medium text-slate-900">Saç Kesimi</td>
                            <td class="py-3 text-slate-600">250 TL</td>
                            <td class="py-3 text-right space-x-2">
                                <button class="text-indigo-600 hover:underline">Düzenle</button>
                                <button class="text-red-600 hover:underline">Sil</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
