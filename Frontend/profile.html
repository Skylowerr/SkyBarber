<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBarber | Randevularım</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <nav class="bg-white shadow-sm border-b border-slate-200 py-4 px-6 flex justify-between items-center">
        <a href="index.html" class="text-xl font-bold text-indigo-600 tracking-wide">SkyBarber</a>
        <div class="space-x-4">
            <a href="index.html" class="text-slate-600 hover:text-indigo-600 transition">Ana Sayfa</a>
            <a href="profile.html" class="text-indigo-600 font-medium">Randevularım</a>
            <a href="auth.html" class="text-slate-600 hover:text-indigo-600 transition">Çıkış Yap</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-10 px-4">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 flex items-center space-x-4">
            <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-bold text-lg">
                Mİ
            </div>
            <div>
                <h2 class="text-xl font-bold text-slate-900">Müşteri İsmi</h2>
                <p class="text-sm text-slate-500">musteri@email.com</p>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <h3 class="text-lg font-bold text-slate-900 mb-4">Randevu Geçmişiniz</h3>
            
            <div class="space-y-4" id="appointments-list">
                <div class="border border-slate-100 rounded-lg p-4 flex flex-wrap justify-between items-center bg-indigo-50/40">
                    <div>
                        <span class="inline-block bg-indigo-100 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-semibold mb-2">Yaklaşan</span>
                        <h4 class="font-bold text-slate-900">Saç Kesimi & Yıkama</h4>
                        <p class="text-sm text-slate-600 mt-1">Berber: Ahmet Yılmaz</p>
                        <p class="text-xs text-slate-500 mt-0.5">25 Mayıs 2026 - Saat: 14:00</p>
                    </div>
                    <button class="mt-4 sm:mt-0 text-sm font-semibold text-red-600 hover:text-red-700 transition">İptal Et</button>
                </div>

                <div class="border border-slate-100 rounded-lg p-4 flex flex-wrap justify-between items-center opacity-75">
                    <div>
                        <span class="inline-block bg-slate-100 text-slate-600 text-xs px-2.5 py-0.5 rounded-full font-semibold mb-2">Tamamlandı</span>
                        <h4 class="font-bold text-slate-900">Sakal Tıraşı</h4>
                        <p class="text-sm text-slate-600 mt-1">Berber: Caner Demir</p>
                        <p class="text-xs text-slate-500 mt-0.5">12 Nisan 2026 - Saat: 11:30</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
