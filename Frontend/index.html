<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBarber | Online Randevu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class="bg-slate-50 text-slate-800 font-sans">

    <nav class="bg-white shadow-sm border-b border-slate-200 py-4 px-6 flex justify-between items-center">
        <a href="index.html" class="text-xl font-bold text-indigo-600 tracking-wide">SkyBarber</a>
        <div id="nav-links" class="space-x-4">
            <a href="index.html" class="text-slate-600 hover:text-indigo-600 transition">Ana Sayfa</a>
            <a href="profile.html" class="text-slate-600 hover:text-indigo-600 transition">Randevularım</a>
            <a href="admin.html" class="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-md hover:bg-slate-200 transition">Admin</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto mt-10 px-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-slate-900 sm:text-4xl">Hızlıca Randevunu Al</h1>
            <p class="mt-3 text-lg text-slate-500">Dilediğin hizmeti ve berberi seç, anında yerini ayırt.</p>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-end mb-8">
            <div class="flex-1 min-w-[200px]">
                <label class="block text-sm font-medium text-slate-700 mb-1">Hizmet Ara</label>
                <input type="text" id="search-input" placeholder="Örn: Saç Kesimi" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
            </div>
            <div class="flex-1 min-w-[200px]">
                <label class="block text-sm font-medium text-slate-700 mb-1">Fiyata Göre Sırala</label>
                <select id="sort-select" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                    <option value="">Varsayılan (En Yeni)</option>
                    <option value="price_asc">Fiyat: Düşükten Yükseğe</option>
                    <option value="price_desc">Fiyat: Yüksekten Düşüğe</option>
                </select>
            </div>
            <button id="btn-search" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-indigo-700 transition w-full md:w-auto">
                Ara
            </button>
        </div>

        <div id="services-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                <div>
                    <h3 class="text-lg font-bold text-slate-900">Saç Kesimi</h3>
                    <p class="text-sm text-slate-500 mt-1">Modern ve tarzınıza uygun kesim.</p>
                </div>
                <div class="mt-6 flex justify-between items-center">
                    <span class="text-xl font-semibold text-slate-900">250 TL</span>
                    <button class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-100 transition">Randevu Seç</button>
                </div>
            </div>
        </div>

        <div id="appointment-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-md w-full p-6 relative">
                <button onclick="document.getElementById('appointment-modal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl cursor-pointer">&times;</button>
                
                <h3 id="modal-service-name" class="text-xl font-bold text-slate-900 mb-1">Hizmet Adı</h3>
                <p id="modal-service-price" class="text-sm font-semibold text-indigo-600 mb-6">0 TL</p>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Randevu Tarihi Seçin</label>
                        <input type="date" id="appointment-date" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Müsait Çalışma Saatleri</label>
                        <div id="time-slots-grid" class="grid grid-cols-3 gap-2">
                            </div>
                    </div>
                    
                    <button id="btn-confirm-appointment" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 transition mt-4 cursor-pointer">
                        Randevuyu Onayla ve Kaydet
                    </button>
                </div>
            </div>
        </div>
    </main>

    

    <script src="js/main.js"></script>
</body>
</html>
