<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBarber | Online Randevu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <nav class="bg-white shadow-sm border-b border-slate-200 py-4 px-6 flex justify-between items-center">
        <a href="index.html" class="text-xl font-bold text-indigo-600 tracking-wide">SkyBarber</a>
        <div id="nav-links" class="space-x-4">
            <a href="index.html" class="text-slate-600 hover:text-indigo-600 transition">Ana Sayfa</a>
            <a href="profile.html" class="text-slate-600 hover:text-indigo-600 transition">Randevularım</a>
            <a href="admin.html" class="bg-slate-100 text-slate-700 px-3 py-1.5 rounded-md hover:bg-slate-200 transition">Admin</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto mt-10 px-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-slate-900 sm:text-4xl">Hızlıca Randevunu Al</h1>
            <p class="mt-3 text-lg text-slate-500">Dilediğin hizmeti ve berberi seç, anında yerini ayırt.</p>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-end mb-8">
            <div class="flex-1 min-w-[200px]">
                <label class="block text-sm font-medium text-slate-600 mb-1">Hizmet Ara</label>
                <input type="text" id="search-service" placeholder="Ön. Saç Kesimi..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex-1 min-w-[200px]">
                <label class="block text-sm font-medium text-slate-600 mb-1">Berber Seçin</label>
                <select id="filter-barber" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="">Tüm Berberler</option>
                </select>
            </div>
            <button id="btn-search" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-indigo-700 transition w-full md:w-auto">Ara</button>
        </div>

        <div id="services-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                <div>
                    <h3 class="text-lg font-bold text-slate-900">Saç Kesimi</h3>
                    <p class="text-sm text-slate-500 mt-1">Modern ve tarzınıza uygun kesim.</p>
                </div>
                <div class="mt-6 flex justify-between items-center">
                    <span class="text-xl font-semibold text-slate-900">250 TL</span>
                    <button class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-100 transition">Randevu Seç</button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
